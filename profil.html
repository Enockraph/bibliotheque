<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon espace — BibliothèquePLR</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1.2rem;margin-bottom:2rem}
    .dash-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .2s}
    .dash-card:hover{transform:translateY(-3px)}
    .d-icon{font-size:2.2rem;margin-bottom:.5rem}
    .d-val{font-size:2rem;font-weight:800;color:var(--primary)}
    .d-label{font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:.2rem}
    .tabs-nav{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
    .tab-btn{padding:.7rem 1.5rem;font-weight:600;font-size:.9rem;color:var(--text-muted);background:transparent;border:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tab-content{display:none}.tab-content.active{display:block}
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <img src="assets/images/logo.png" alt="BibliothequePLR" onerror="this.style.display='none'" />
    <span class="nav-logo-text">Bibliotheque<span>PLR</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html">Accueil</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="admin/index.html" id="nav-admin" style="display:none">Admin</a>
    <button class="btn btn-outline btn-sm" id="nav-logout">Deconnexion</button>
  </div>
</nav>
<main class="container" style="padding-top:2rem;padding-bottom:3rem">
  <div id="profil-header" style="background:#fff;border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);margin-bottom:1.5rem"></div>
  <div class="dashboard-grid">
    <div class="dash-card" onclick="document.getElementById('tab-dl-btn').click()">
      <div class="d-icon">📥</div><div class="d-val" id="stat-dl">—</div><div class="d-label">Telechargements</div>
    </div>
    <div class="dash-card" onclick="document.getElementById('tab-fav-btn').click()">
      <div class="d-icon">❤️</div><div class="d-val" id="stat-fav">—</div><div class="d-label">Favoris</div>
    </div>
    <div class="dash-card" onclick="window.location='marketplace.html'">
      <div class="d-icon">📦</div><div class="d-val" style="font-size:1rem;padding-top:.6rem">Acceder</div><div class="d-label">Marketplace</div>
    </div>
  </div>
  <div class="tabs-nav">
    <button class="tab-btn active" id="tab-dl-btn" data-tab="downloads">📥 Mes telechargements</button>
    <button class="tab-btn" id="tab-fav-btn" data-tab="favorites">❤️ Mes favoris</button>
  </div>
  <div id="tab-downloads" class="tab-content active">
    <div id="downloads-grid" class="books-grid"></div>
    <div id="empty-dl" style="display:none;text-align:center;padding:2.5rem;background:#fff;border-radius:12px;box-shadow:var(--shadow)">
      <div style="font-size:3rem;margin-bottom:.8rem">📥</div>
      <p style="color:#64748b">Aucun telechargement pour l'instant.</p>
      <a href="marketplace.html" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">Aller a la marketplace</a>
    </div>
  </div>
  <div id="tab-favorites" class="tab-content">
    <div id="favs-grid" class="books-grid"></div>
    <div id="empty-fav" style="display:none;text-align:center;padding:2.5rem;background:#fff;border-radius:12px;box-shadow:var(--shadow)">
      <div style="font-size:3rem;margin-bottom:.8rem">❤️</div>
      <p style="color:#64748b">Aucun favori pour l'instant.</p>
      <a href="marketplace.html" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">Explorer la marketplace</a>
    </div>
  </div>
</main>
<script type="module">
  import { requireAuth, logout, getProfile } from './js/auth.js';
  import { getDownloads, getFavorites } from './js/books.js';
  document.getElementById('nav-logout').addEventListener('click', logout);
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
  function bookCard(b, date) {
    return `<a href="detail.html?id=${b.id}" class="book-card">
      <div class="book-cover"><img src="${b.image_url || 'assets/images/placeholder.png'}" alt="${b.titre}" loading="lazy"/></div>
      <div class="book-info">
        <div class="book-title">${b.titre}</div>
        <div class="book-author">${b.auteur}</div>
        ${b.categorie ? `<span class="book-cat">${b.categorie}</span>` : ''}
        ${date ? `<div style="font-size:.73rem;color:#94a3b8;margin-top:.3rem">${new Date(date).toLocaleDateString('fr-FR')}</div>` : ''}
      </div></a>`;
  }
  async function init() {
    const session = await requireAuth();
    if (!session) return;
    const profile = await getProfile(session.user.id);
    if (profile?.role === 'admin') document.getElementById('nav-admin').style.display = '';
    document.getElementById('profil-header').innerHTML = `
      <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
        ${profile?.avatar_url ? `<img src="${profile.avatar_url}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)"/>` : `<div style="width:64px;height:64px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff">👤</div>`}
        <div>
          <h2 style="margin:0;color:var(--primary)">${profile?.nom || 'Utilisateur'}</h2>
          <p style="color:#64748b;margin:.2rem 0">${session.user.email}</p>
          <span class="badge badge-${profile?.role || 'user'}">${profile?.role || 'user'}</span>
        </div>
      </div>`;
    const [downloads, favs] = await Promise.all([getDownloads(session.user.id), getFavorites(session.user.id)]);
    document.getElementById('stat-dl').textContent = downloads.length;
    document.getElementById('stat-fav').textContent = favs.length;
    const dlGrid = document.getElementById('downloads-grid');
    if (!downloads.length) document.getElementById('empty-dl').style.display = '';
    else dlGrid.innerHTML = downloads.map(d => d.books ? bookCard(d.books, d.downloaded_at) : '').join('');
    const favGrid = document.getElementById('favs-grid');
    if (!favs.length) document.getElementById('empty-fav').style.display = '';
    else favGrid.innerHTML = favs.map(f => f.books ? bookCard(f.books, null) : '').join('');
  }
  init();
</script>
</body>
</html>
